<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>サービス内容｜暮らしのマモリテ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="/" aria-label="暮らしのマモリテ トップへ">
        <img src="logo-mamorite.svg" alt="暮らしのマモリテ">
      </a>

      <nav class="site-header__nav" aria-label="グローバルナビゲーション">
        <a href="/#service">サービス内容</a>
        <!-- トップページ側で料金のリンク先は #price ですが、対応する id は未確定です。 -->
        <a href="/#price">料金</a>
        <a href="/#business">法人向け</a>
        <a href="/#faq">よくある質問</a>
      </nav>

      <a class="site-header__cta" href="/#contact">まずは相談する</a>
    </div>
  </header>

  <section class="service-page-hero-section" aria-labelledby="service-page-hero-title">
    <div class="service-page-hero-stage">

      <img
        class="service-page-hero-staff"
        src="assets/images/service/service-hero-staff.webp"
        alt=""
        aria-hidden="true"
      >

      <span
        class="service-page-hero-deco service-page-hero-deco-top"
        aria-hidden="true"
      ></span>

      <div class="service-page-hero-copy">
        <h1 class="service-page-hero-title" id="service-page-hero-title">
          <span>暮らしのマモリテ</span>
          <span>
            <em>サービス</em><b>のご案内</b>
          </span>
        </h1>

        <p class="service-page-hero-text">
          暮らしのマモリテは、掃除・洗濯・片付けを中心に、買い物や料理まで、今の暮らしに合わせて継続して支える家事サポートです。毎回すべてを同じ内容に固定するだけでなく、その日の状況を見ながら、優先順位を調整して進めることもできます。
        </p>
      </div>

      <span
        class="service-page-hero-deco service-page-hero-deco-bottom"
        aria-hidden="true"
      ></span>

    </div>
  </section>

  <main></main>
</body>
</html>
